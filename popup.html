<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanSub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="is-loading">
  <header class="brand-bar">
    <div class="brand">
      <img class="mark" src="assets/icon48.png" alt="">
      <div><h1>PanSub</h1><p>LECTURE SIGNAL</p></div>
    </div>
    <span class="version">1.1.16</span>
  </header>

  <section class="status-panel" aria-live="polite">
    <div class="status-copy">
      <span class="status-dot" id="statusDot"></span>
      <div>
        <strong id="status" data-i18n="statusReady">Canvas / Panopto subtitles</strong>
        <small id="statusDetail" data-i18n="statusDetail">Translation layer is ready</small>
      </div>
    </div>
    <div class="signal-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </section>

  <main class="controls">
    <label class="toggle-row" for="enabled">
      <span><strong data-i18n="showSubtitles">Show subtitles</strong><small data-i18n="showSubtitlesHelp">Enable the live translation layer</small></span>
      <input type="checkbox" id="enabled">
    </label>

    <div class="control-grid">
      <label class="control-field" for="displayMode"><span data-i18n="mode">Mode</span><select id="displayMode"><option value="bilingual" data-i18n="displayBilingual">Bilingual</option><option value="translation" data-i18n="displayTranslation">Translation only</option><option value="original" data-i18n="displayOriginal">Original only</option></select></label>
      <label class="control-field" for="targetLanguage"><span data-i18n="targetLanguage">Translate to</span><select id="targetLanguage"><option value="zh-CN" data-i18n="targetChineseSimplified">简体中文</option><option value="zh-TW" data-i18n="targetChineseTraditional">繁體中文</option><option value="ja" data-i18n="targetJapanese">日本語</option><option value="ko" data-i18n="targetKorean">한국어</option><option value="en" data-i18n="targetEnglish">English</option></select></label>
      <label class="control-field" for="subtitlePosition"><span data-i18n="position">Position</span><select id="subtitlePosition"><option value="auto" data-i18n="positionAuto">Auto</option><option value="video-bottom" data-i18n="positionVideoBottom">Video bottom</option><option value="page-bottom" data-i18n="positionPageBottom">Page bottom</option><option value="follow-caption" data-i18n="positionFollowCaptionShort">Follow caption</option><option value="manual" data-i18n="positionManual">Manual drag</option></select></label>
      <label class="control-field" for="interfaceLanguage"><span data-i18n="interfaceLanguage">Interface</span><select id="interfaceLanguage"><option value="en" data-i18n="languageEnglish">English</option><option value="zh-CN" data-i18n="languageChinese">中文</option></select></label>
    </div>
  </main>

  <button id="openOptions" type="button" class="settings-button"><span class="settings-glyph" aria-hidden="true">⌘</span><span data-i18n="openSettings">Open settings</span><span aria-hidden="true">›</span></button>
  <footer><span class="footer-dot"></span><span data-i18n="autoSync">Changes sync instantly</span><kbd>MV3</kbd></footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
